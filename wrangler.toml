name = "agentic-contacts"
main = "src/worker.ts"
compatibility_date = "2026-07-01"

# Declaring any route turns the workers.dev hostname off by default, and
# several things still point at it: the CLI and the /contacts skill, MCP
# clients, and the phone app's fallback URL. Stated explicitly so a default
# can't quietly cut them off — same reasoning as the phone app's config.
# (Must stay above [[routes]] — TOML would otherwise read it as a route key.)
workers_dev = true

# The address people type. Cloudflare owns the DNS for autobirds.com, so
# `custom_domain` creates the record and the certificate on deploy.
[[routes]]
pattern = "contacts.autobirds.com"
custom_domain = true

# The single-page UI. Served at / by the Worker runtime; the API routes below
# still win because run_worker_first sends every request to the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"

# Contacts, companies, lists and interactions. Replaces the old data/*.json
# files — Workers has no filesystem.
[[d1_databases]]
binding = "DB"
database_name = "agentic-contacts"
database_id = "b68bb761-3d41-4906-9f33-b8caae7e45f8"
migrations_dir = "migrations"

# The API key, from the account-level Secrets Store rather than this Worker's
# own secrets. Every service that calls this one binds the same secret, so
# rotating it is one command in one place and nothing can drift out of step.
# Rotate with:
#   wrangler secrets-store secret update 743bff236e564457b2b703e8464bc81f \
#     --name AGENTIC_CONTACTS_API_KEY --remote
# Local dev cannot reach the store; put API_KEY in .dev.vars for that.
[[secrets_store_secrets]]
binding = "API_KEY_STORE"
store_id = "743bff236e564457b2b703e8464bc81f"
secret_name = "AGENTIC_CONTACTS_API_KEY"

# Nightly at 20:47 UTC (23:47 Israel) — late enough that "today" is over.
# Counts the day's networking and reports it to the Kompany canvas.
[triggers]
crons = ["47 20 * * *"]

[vars]
KOMPANY_MACHINE_ID = "0df73119-7c48-4bcd-bb86-3f141b4f239c"
