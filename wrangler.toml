name = "agentic-contacts"
main = "src/worker.ts"
compatibility_date = "2026-07-01"

# The single-page UI. Served at / by the Worker runtime; the API routes below
# still win because run_worker_first sends every request to the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"

# Contacts, companies, lists and interactions. Replaces the old data/*.json
# files — Workers has no filesystem.
[[d1_databases]]
binding = "DB"
database_name = "agentic-contacts"
database_id = "b68bb761-3d41-4906-9f33-b8caae7e45f8"
migrations_dir = "migrations"

# The API key, from the account-level Secrets Store rather than this Worker's
# own secrets. Every service that calls this one binds the same secret, so
# rotating it is one command in one place and nothing can drift out of step.
# Rotate with:
#   wrangler secrets-store secret update 743bff236e564457b2b703e8464bc81f \
#     --name AGENTIC_CONTACTS_API_KEY --remote
# Local dev cannot reach the store; put API_KEY in .dev.vars for that.
[[secrets_store_secrets]]
binding = "API_KEY_STORE"
store_id = "743bff236e564457b2b703e8464bc81f"
secret_name = "AGENTIC_CONTACTS_API_KEY"
