<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark tile matching the app's chrome -->
  <rect width="64" height="64" rx="14" fill="#16171b"/>
  <!-- Two figures, each a small head over a larger body. Four circles is all
       that survives at 16px; anything with a stroke turns to mush. -->
  <g fill="#e8eaee">
    <circle cx="21" cy="21" r="7"/>
    <circle cx="21" cy="40" r="10"/>
  </g>
  <!-- The second figure is the agent, in the app's indigo -->
  <g fill="#5e6ad2">
    <circle cx="43" cy="21" r="7"/>
    <circle cx="43" cy="40" r="10"/>
  </g>
</svg>
